[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorized-query-engine"
version = "0.1.0"
description = "Demystifies why analytics databases are fast: a SQL engine you built yourself, benchmarked honestly against DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlglot>=30,<31", "pyarrow>=21", "numpy>=2"]

[project.optional-dependencies]
compare = ["duckdb>=1.5"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "duckdb>=1.5", "pyarrow-stubs"]

[project.scripts]
vqe = "vectorized_query_engine.cli:main"
vqe-report = "vectorized_query_engine.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 300

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S608"]
"src/vectorized_query_engine/data.py" = ["S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "duckdb.*"]
ignore_missing_imports = true
